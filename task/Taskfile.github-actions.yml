version: '3'

tasks:
  documentation:update:
    desc: "Update GitHub Actions template documentation"
    cmds:
      - task: run-script
        vars:
          SCRIPT: github-documentation-update
      - SKIP_FIX=1 task lint:markdown -- docs/github-actions-templates.md

  documentation:diff:
    desc: "Diff generated documentation ignoring select lines"
    cmds:
      # Ignore some PO metadata when git diff'ing, e.g.
      #
      # "POT-Creation-Date: 2025-03-12 18:18+0100\n"
      # "PO-Revision-Date: 2025-03-12 18:18+0100\n"
      - git diff --exit-code --ignore-blank-lines --ignore-matching-lines='automatically created' '*.md'

  documentation:checkout:
    desc: 'git checkout all translation file changes if only date metadata is changed'
    cmds:
      - git checkout '*.md'
    # https://taskfile.dev/reference/schema#precondition
    preconditions:
      - sh: task {{.TASK | replace ":checkout" ":diff" }}
        msg: |
          Translations seem to have changed.

          Run

              task {{.TASK | replace ":checkout" ":diff" }}

          to check.

  template-headers:update:
    prompt: "Updating headers may break things, so check result afterwards. Really update headers?"
    desc: "Update headers in GitHub Actions templates"
    cmds:
      - task: run-script
        vars:
          SCRIPT: template-headers-update

  config-headers:update:
    prompt: "Updating headers may break things, so check result afterwards. Really update headers?"
    desc: "Update headers in tool config"
    cmds:
      - task: run-script
        vars:
          SCRIPT: config-headers-update

  link:
    desc: "Set up symlinks"
    prompt: "Reset all symlinks?"
    cmds:
      - task: run-script
        vars:
          SCRIPT: github-actions-link
      - |
          for f in $(find templates -mindepth 1 -maxdepth 1 -type d | sort); do
            WORKFLOW_FOLDER="$f/.github/workflows" task github-actions:workflow-documentation:update
          done
    silent: true

  show:
    desc: "Show links"
    cmds:
      - find templates -type l -ls
    silent: true

  run-script:
    internal: true
    cmds:
      - docker run --rm --volume "$PWD:/app" --user ${COMPOSE_USER:-deploy} itkdev/php8.4-fpm:latest task/scripts/{{.SCRIPT}}
    requires:
      vars:
        - SCRIPT

  workflow-documentation:update:
    cmds:
      - defer: rm {{.DATA_PATH}}
      - |
        : > {{.DATA_PATH}}
        (
        echo "repository:"
        # TODO Get this URL from `git`
        echo "  url: 'https://github.com/itk-dev/devops_itkdev-docker'"
        echo "  name: 'ITK-dev docker setup'"
        ) >> {{.DATA_PATH}}
        echo "files:" >> {{.DATA_PATH}}
        for f in $(find {{.WORKFLOW_FOLDER}} -name '*.yaml'); do
          echo "  - $(basename "$f")" >> {{.DATA_PATH}}
        done

      - cat {{.DATA_PATH}}

      - docker compose run --rm jinja2-cli --strict --format=yaml {{.TEMPLATE_PATH}} {{.DATA_PATH}} | tee {{.WORKFLOW_FOLDER}}/README.workflows.md
      - task lint:markdown
    vars:
      TEMPLATE_PATH: task/templates/README.workflows.md.j2
      DATA_PATH: tmp-data.yaml
    requires:
      vars:
        - WORKFLOW_FOLDER
