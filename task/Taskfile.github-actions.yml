version: '3'

tasks:
  documentation:update:
    desc: "Update GitHub Actions template documentation"
    cmds:
      - task: run-script
        vars:
          SCRIPT: github-documentation-update
      - SKIP_FIX=1 task lint:markdown -- docs/github-actions-templates.md

  documentation:diff:
    desc: "Diff generated documentation ignoring select lines"
    cmds:
      # Ignore some PO metadata when git diff'ing, e.g.
      #
      # "POT-Creation-Date: 2025-03-12 18:18+0100\n"
      # "PO-Revision-Date: 2025-03-12 18:18+0100\n"
      - git diff --exit-code --ignore-blank-lines --ignore-matching-lines='automatically created' '*.md'

  documentation:checkout:
    desc: 'git checkout all translation file changes if only date metadata is changed'
    cmds:
      - git checkout '*.md'
    # https://taskfile.dev/reference/schema#precondition
    preconditions:
      - sh: task {{.TASK | replace ":checkout" ":diff" }}
        msg: |
          Translations seem to have changed.

          Run

              task {{.TASK | replace ":checkout" ":diff" }}

          to check.

  template-headers:update:
    prompt: "Updating headers may break things, so check result afterwards. Really update headers?"
    desc: "Update headers in GitHub Actions templates"
    cmds:
      - |
        for f in $(find github/workflows/ -name '*.yaml'); do
          echo "$f"
          # If file starts with `# ` …
          if [[ $(head --lines=1 "$f") =~ "^# " ]]; then
            # … replace the header.
            # This is done by deleting all lines from the top of the file to a blank line.
            docker run --rm --volume=$PWD:/app --user ${COMPOSE_USER:-deploy} itkdev/php8.4-fpm:latest sed -i '1,/^$/d' "$f"
          fi

          # Write header and file into temporary file.
          (
          echo "# Do not edit this file! Make a pull request on changing"
          echo "# $f in"
          echo "# https://github.com/itk-dev/devops_itkdev-docker if need be."
          echo ""
          cat "$f"
          ) > "$f.tmp"
          # Replace original file with temporary file.
          mv "$f.tmp" "$f"
        done

  link:
    desc: "Set up symlinks"
    prompt: "Reset all symlinks?"
    cmds:
      - task: run-script
        vars:
          SCRIPT: github-actions-link
    silent: true

  show:
    desc: "Show links"
    cmds:
      - find templates -type l -ls
    silent: true

  run-script:
    internal: true
    cmds:
      - docker run --rm --volume "$PWD:/app" --user ${COMPOSE_USER:-deploy} itkdev/php8.4-fpm:latest task/scripts/{{.SCRIPT}}
    requires:
      vars:
        - SCRIPT
