[project]
name = "CHANGE-ME"
version = "0.0.1"
description = "CHANGE-ME"
requires-python = ">=3.11"
dependencies = [
    "uvicorn[standard]>=0.30.0",
]

# A dependency group, not an optional extra: `uv sync` installs the `dev` group by
# default (and `--no-dev` skips it), but installs extras only with `--extra`.
[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.0",
    "bandit>=1.7",
    "basedpyright>=1.31",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 99
exclude = ["build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # Allow Depends() in function defaults (FastAPI pattern)

[tool.ruff.lint.isort]
known-first-party = ["app"]

# Existing errors are recorded in .basedpyright/baseline.json; only new ones fail.
[tool.basedpyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
