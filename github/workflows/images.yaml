### ### Images
###
### Checks that all docker images can be pulled.

name: Images

on:
  pull_request:

jobs:
  images:
    runs-on: ubuntu-latest
    name: Check that docker images can be pulled
    steps:
      - uses: actions/checkout@v5
      - name: Check that docker images can be pulled
        run: |
          COMPOSE_PROFILES='*' docker compose pull
