### ### Drupal Lint
###
### Checks the changelog and lints Markdown, YAML, styles and JavaScript.
###
### One job for all of it: a job costs a checkout, an image pull and a minimum
### of one billed minute, and none of these checks need the project's
### dependencies. Each check runs even if an earlier one fails, so a pull
### request reports every problem at once.
###
### #### Assumptions
###
### 1. Docker compose services named `markdownlint` and `prettier` exist.
### 2. [markdownlint-cli configuration
###    files](https://github.com/igorshubovych/markdownlint-cli?tab=readme-ov-file#configuration),
###    `.markdownlint.jsonc` and `.markdownlintignore`, control what is
###    actually linted and how.
### 3. A [Prettier configuration file](https://prettier.io/docs/configuration),
###    `.prettierrc.yaml`, makes Prettier format YAML files the way the
###    framework expects.

name: Lint

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Create docker network
        run: |
          docker network create frontend

      - name: Check that changelog has been updated
        if: github.event_name == 'pull_request'
        run: |
          git fetch
          git diff --exit-code origin/${{ github.base_ref }} -- CHANGELOG.md && exit 1 || exit 0

      - name: Markdown
        if: "!cancelled()"
        run: |
          docker compose run --rm --no-deps markdownlint markdownlint '**/*.md'

      - name: YAML
        if: "!cancelled()"
        run: |
          docker compose run --rm --no-deps prettier '**/*.{yml,yaml}' --check

      - name: Styles
        if: "!cancelled()"
        run: |
          docker compose run --rm --no-deps prettier 'web/themes/custom/**/css/**/*.{css,scss}' --check

      - name: JavaScript
        if: "!cancelled()"
        run: |
          docker compose run --rm --no-deps prettier 'web/themes/custom/**/js/**/*.js' --check
