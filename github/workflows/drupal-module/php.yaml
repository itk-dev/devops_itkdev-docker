# Do not edit this file! Make a pull request on changing
# github/workflows/drupal-module/php.yaml in
# https://github.com/itk-dev/devops_itkdev-docker if need be.

### ### Drupal module PHP
###
### Validates and audits `composer.json`, checks coding standards with
### [PHP_CodeSniffer](https://github.com/PHPCSStandards/PHP_CodeSniffer), and
### lints Twig files.
###
### One job for all of it: every check needs the project's Composer
### dependencies, so they are installed once. Each check runs even if an
### earlier one fails, so a pull request reports every problem at once.
###
### `--no-deps` keeps `docker compose run` from starting the database and cache
### services; none of these checks touch them.
###
### #### Assumptions
###
### 1. A docker compose service named `phpfpm` can be run and `composer` can be
###    run inside the `phpfpm` service.
### 2. These dev requirements are in `composer.json`:
###
###    ``` shell
###    docker compose run --rm --no-deps phpfpm composer require --dev ergebnis/composer-normalize
###    docker compose run --rm --no-deps phpfpm composer require --dev drupal/coder
###    docker compose run --rm --no-deps phpfpm composer require --dev vincentlanglet/twig-cs-fixer
###    ```
###
###    Normalize `composer.json` by running
###
###    ``` shell
###    docker compose run --rm --no-deps phpfpm composer normalize
###    ```
###
### 3. Configuration files in the root of the project define which files to
###    check and which rules to use.

name: PHP

env:
  COMPOSE_USER: runner

on:
  pull_request:
    paths: &paths
      - "**/*.php"
      - "**/*.twig"
      - "composer.json"
      - "composer.lock"
      - "docker-compose.yml"
  push:
    branches:
      - main
      - develop
    paths: *paths

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create docker network
        run: |
          docker network create frontend

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock', 'docker-compose.yml') }}
          restore-keys: composer-

      - name: Validate composer.json
        run: |
          docker compose run --rm --no-deps phpfpm composer validate --strict

      - name: Install dependencies
        run: |
          docker compose run --rm --no-deps phpfpm composer install

      - name: Check that composer.json is normalized
        if: "!cancelled()"
        run: |
          docker compose run --rm --no-deps phpfpm composer normalize --dry-run

      - name: Audit dependencies
        if: "!cancelled()"
        run: |
          docker compose run --rm --no-deps phpfpm composer audit --locked

      - name: Check coding standards
        if: "!cancelled()"
        run: |
          docker compose run --rm --no-deps phpfpm vendor/bin/phpcs

      - name: Check Twig files
        if: "!cancelled()"
        run: |
          docker compose run --rm --no-deps phpfpm vendor/bin/twig-cs-fixer lint
