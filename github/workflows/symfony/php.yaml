# github/workflows/symfony/php.yaml in
# https://github.com/itk-dev/devops_itkdev-docker if need be.

### ### Symfony PHP
###
### Validates and audits `composer.json`, checks PHP coding standards and
### validates Twig files.
###
### One job for all of it: the checks share the project's Composer
### dependencies, so they are installed once. Each check runs even if an
### earlier one fails, so a pull request reports every problem at once;
### those needing `vendor` are skipped when the install fails.
###
### `--no-deps` keeps `docker compose run` from starting the database and cache
### services; none of these checks touch them.
###
### #### Assumptions
###
### 1. A docker compose service named `phpfpm` can be run and `composer` can be
###    run inside the `phpfpm` service.
### 2. [ergebnis/composer-normalize](https://github.com/ergebnis/composer-normalize),
###    [friendsofphp/php-cs-fixer](https://github.com/PHP-CS-Fixer/PHP-CS-Fixer) and
###    [vincentlanglet/twig-cs-fixer](https://github.com/VincentLanglet/Twig-CS-Fixer)
###    are dev requirements in `composer.json`:
###
###    ``` shell
###    docker compose run --rm --no-deps phpfpm composer require --dev ergebnis/composer-normalize
###    docker compose run --rm --no-deps phpfpm composer require --dev friendsofphp/php-cs-fixer
###    docker compose run --rm --no-deps phpfpm composer require --dev vincentlanglet/twig-cs-fixer
###    ```
###
### #### Composer
###
### Validates `composer.json`, checks that it is normalized and audits
### `composer.lock` for known vulnerabilities.
###
### Normalize `composer.json` by running
###
### ``` shell
### docker compose run --rm --no-deps phpfpm composer normalize
### ```
###
### #### Coding standards
###
### Checks that PHP code adheres to the [Symfony coding
### standards](https://symfony.com/doc/current/contributing/code/standards.html).
###
### Clean up and check code by running
###
### ``` shell
### docker compose run --rm --no-deps phpfpm vendor/bin/php-cs-fixer fix
### docker compose run --rm --no-deps phpfpm vendor/bin/php-cs-fixer fix --dry-run --diff
### ```
###
### > [!NOTE]
### > The template adds `.php-cs-fixer.dist.php` as [a configuration file for
### > PHP CS
### > Fixer](https://github.com/PHP-CS-Fixer/PHP-CS-Fixer/blob/master/doc/config.rst)
### > and this makes it possible to override the actual configuration used in a
### > project by adding a more important configuration file, `.php-cs-fixer.php`.
###
### #### Twig
###
### Validates Twig files.
###
### A [Configuration
### file](https://github.com/VincentLanglet/Twig-CS-Fixer/blob/main/docs/configuration.md#configuration-file)
### in the root of the project defines which files to check and rules to use.

name: PHP

env:
  COMPOSE_USER: runner

on:
  pull_request:
    paths: &paths
      - "**/*.php"
      - "**/*.twig"
      - "composer.json"
      - "composer.lock"
      - "docker-compose.yml"
  push:
    branches:
      - main
      - develop
    paths: *paths

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create docker network
        run: |
          docker network create frontend

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock', 'docker-compose.yml') }}
          restore-keys: composer-

      - name: Validate composer.json
        run: |
          docker compose run --rm --no-deps phpfpm composer validate --strict

      - name: Install dependencies
        id: install
        if: "!cancelled()"
        run: |
          docker compose run --rm --no-deps phpfpm composer install

      - name: Check that composer.json is normalized
        if: "!cancelled() && steps.install.outcome == 'success'"
        run: |
          docker compose run --rm --no-deps phpfpm composer normalize --dry-run

      - name: Audit dependencies
        if: "!cancelled()"
        run: |
          docker compose run --rm --no-deps phpfpm composer audit --locked

      - name: Check coding standards
        if: "!cancelled() && steps.install.outcome == 'success'"
        run: |
          docker compose run --rm --no-deps phpfpm vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Check Twig files
        if: "!cancelled() && steps.install.outcome == 'success'"
        run: |
          docker compose run --rm --no-deps phpfpm vendor/bin/twig-cs-fixer lint
