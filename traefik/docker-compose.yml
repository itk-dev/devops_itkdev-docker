---
networks:
  frontend:
    external: true
  proxy:
    driver: bridge
    internal: true

services:
  socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: socket-proxy
    restart: unless-stopped
    profiles:
      - docker
    volumes:
      - ${CONTAINER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 1
      TASKS: 1
    networks:
      - proxy

  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - frontend
    ports:
      - "80:80"
      - "8080:8080"
      - "443:443"
    volumes:
      - $PWD/${TRAEFIK_CONFIG:-traefik.yml}:/traefik.yml:ro
      - $PWD/dynamic-conf.yaml:/config/dynamic-conf.yaml:ro
      - $PWD/ssl:/certs:ro
    labels:
      - "traefik.enable=true"
      - "traefik.log.level=DEBUG"
      - "traefik.http.routers.traefik.rule=Host(`traefik.local.itkdev.dk`)"
